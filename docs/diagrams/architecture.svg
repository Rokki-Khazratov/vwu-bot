<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
<title id="architecture-title">VWU learning assistant</title>
<desc id="architecture-desc">Telegram practice backed by persistent attempts, feedback and vocabulary.</desc>
<defs>
      <style>#architecture-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580 }
      #architecture-root { color: var(--ink); font-family: Geist,Arial,sans-serif; }
      #architecture-root .diagram-container { width:100%;overflow-x:auto }
      #architecture-root .figure-title { font-family:"Instrument Serif",Georgia,serif;font-size:30px;fill:var(--ink) }
      #architecture-root .eyebrow-label, #architecture-root .arrow-label, #architecture-root .tag-label, #architecture-root .sub-label, #architecture-root .legend-label { font-family:"Geist Mono",Menlo,monospace;fill:var(--muted) }
      #architecture-root .eyebrow-label { font-size:8px;letter-spacing:1.4px }
      #architecture-root .summary-label { font-family:Geist,Arial,sans-serif;font-size:12px;fill:var(--muted) }
      #architecture-root .node-name { font-family:Geist,Arial,sans-serif;font-size:12px;font-weight:600;fill:var(--ink) }
      #architecture-root .sub-label { font-size:9px }
      #architecture-root .tag-label { font-size:8px;letter-spacing:.6px }
      #architecture-root .arrow-label { font-size:8px;letter-spacing:.3px }
      #architecture-root .legend-label { font-size:8px }
      @media print {
#architecture-root .diagram-container { overflow-x:visible }
}</style><marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs>
